plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'com.gradleup.shadow' version '9.4.2'
}

// 面板资源压缩逻辑（词法分析压缩内联 <style>/<script>）
apply from: 'gradle/minify.gradle'

version = project.mod_version
group = project.maven_group

repositories {
    mavenCentral()
}

configurations {
    shadowBundle
    implementation.extendsFrom shadowBundle
}

dependencies {
    // Minecraft And Fabric
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // SQL Driver
    shadowBundle("com.mysql:mysql-connector-j:9.7.0")

    // Redis
    shadowBundle("redis.clients:jedis:5.2.0")
}

processResources {
    def version = project.version
    inputs.property "version", version

    filesMatching("fabric.mod.json") {
        expand "version": version
    }

    from(project.rootProject.file("LICENSE")) {
        rename { "LICENSE_${project.name}" }
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

shadowJar {
    destinationDirectory = layout.buildDirectory.dir("tmp/shadowJar")

    configurations.add(project.configurations.shadowBundle)

    minimize {
        exclude(dependency('com.mysql:mysql-connector-j:.*'))
        exclude(dependency('redis.clients:.*:.*'))
        exclude(dependency('org.apache.commons.pool2:.*:.*'))
        exclude(dependency('com.google.code.gson:.*:.*'))
        exclude(dependency('org.slf4j:.*:.*'))
    }

    def shadowPrefix = "com.juzizhen.redemptioncodefabric.rcode.shadow"

    relocate 'com.mysql', "${shadowPrefix}.mysql"
    relocate 'redis.clients', "${shadowPrefix}.redis"
    relocate 'org.apache.commons.pool2', "${shadowPrefix}.pool2"
    relocate 'com.google', "${shadowPrefix}.google"
    relocate 'org.json', "${shadowPrefix}.org.json"
    relocate 'org.slf4j', "${shadowPrefix}.org.slf4j"

    exclude 'META-INF/maven/**'
    exclude 'META-INF/versions/**'
    exclude 'module-info.class'
    exclude '**/Thumbs.db'
    exclude 'README*'
    exclude 'INFO_BIN'
    exclude 'INFO_SRC'
    exclude 'jndi.properties'
    exclude '*.xsd'
    exclude 'google/**'
    exclude '**/*.proto'

    // 许可证清理：移除所有依赖（MySQL Connector/J、Commons Pool、Gson、SLF4J 等）带入的
    // LICENSE / NOTICE / DEPENDENCIES 文件，仅保留以下三项：
    //   - LICENSE_redemptioncodefabric ：项目自身许可（根目录，由 processResources 重命名注入）
    //   - META-INF/LICENSE             ：本仓库手工维护的精简版第三方许可全文（licenses/ 目录注入）
    //   - META-INF/NOTICE              ：本仓库手工维护的版权归属声明（licenses/ 目录注入）
    // 注意：Gradle 中不含斜杠的 exclude 模式（如 'LICENSE'）会按文件名在任意目录匹配，
    //       会误删 META-INF/LICENSE，故改用 eachFile 按精确相对路径过滤。
    def keptLicensePaths = [
            'LICENSE_redemptioncodefabric',
            'META-INF/LICENSE',
            'META-INF/NOTICE'
    ] as Set
    eachFile { fcd ->
        if (fcd.directory) {
            return
        }
        def path = fcd.relativePath.pathString
        if (keptLicensePaths.contains(path)) {
            return
        }
        def name = fcd.name
        if (name.startsWith('LICENSE') || name.startsWith('NOTICE') || name == 'DEPENDENCIES') {
            fcd.exclude()
        }
    }

    // 注入本仓库手工维护的精简版第三方许可与版权声明（licenses/ 目录）。
    from(project.file('licenses')) {
        into 'META-INF'
    }

    mergeServiceFiles()
}

remapJar {
    dependsOn shadowJar
    inputFile.set(shadowJar.archiveFile)
}